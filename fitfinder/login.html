<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>FitFinder - Login</title>

</head>

<body>

    <a
        href="#conteudo"
        class="skip-link">
        Pular para o conteúdo principal
    </a>


    <header>

        <div>

            <h1>
                FitFinder
            </h1>

            <p>
                Encontre. Treine. Evolua.
            </p>

        </div>

        <nav aria-label="Navegação principal">

            <ul>

                <li>
                    <a href="index.html">
                        Academias
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main id="conteudo">

        <section class="login-container">

            <h2>
                🔐 Área de Acesso
            </h2>

            <p
                class="subtitle"
                style="color: var(--azul); font-weight: 600; margin-bottom: 25px;">
                Para acessar recursos completos, faça login.
            </p>


            <form
                id="form-login"
                class="form-login">

                <div class="input-group">

                    <label for="login-email">
                        E-mail *
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="seuemail@email.com"
                        required>

                </div>


                <div class="input-group">

                    <label for="login-senha">
                        Senha *
                    </label>

                    <input
                        type="password"
                        id="login-senha"
                        placeholder="••••••••"
                        required>

                </div>


                <div style="text-align: right; margin-top: -5px; margin-bottom: 20px;">

                    <a
                        href="recuperar-senha.html"
                        class="link-esqueci">
                        Esqueci minha senha
                    </a>

                </div>


                <button type="submit">
                    Entrar
                </button>

            </form>


            <div class="register-area">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a
                    href="cadastro.html"
                    class="btn-secondary">
                    Cadastre-se
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 FitFinder - Encontre. Treine. Evolua.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
