<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="css/style.css">

    <title>FitFinder - Login</title>

</head>


<body>


    <!-- Cabeçalho -->

    <header>

        <div>

            <h1>
                FitFinder
            </h1>

            <p>
                Encontre. Treine. Evolua.
            </p>

        </div>


        <!-- Navegação -->

        <nav aria-label="Navegação principal">

            <a href="index.html">
                Academias
            </a>

        </nav>

    </header>


    <!-- Conteúdo principal -->

    <main id="conteudo">


        
        <!-- Login -->
        

        <section>

            <h2>
                Entre na sua conta
            </h2>

            <p>
                Acesse seus treinos, metas e progressos.
            </p>


            <!-- Formúlario de login -->

            <form>

                <!-- E-mail -->

                <div>

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        aria-label="E-mail"
                        aria-required="true"
                        required>

                </div>


                <!-- Senha -->

                <div>

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        aria-label="Senha"
                        aria-required="true"
                        required>

                </div>


                <!-- Botão -->

                <button
                    type="submit"
                    aria-label="Entrar na conta">

                    Entrar

                </button>

            </form>


            <!-- Link para cadastros -->

            <div>

                <p>
                    Ainda não possui conta?
                </p>

                <a
                    href="#cadastro"
                    aria-label="Ir para o formulário de criação de conta">

                    Criar uma conta

                </a>

            </div>

        </section>


        <!-- Cadastro -->

        <section id="cadastro">

            <h2>
                Crie seu cadastro
            </h2>

            <p>
                Cadastre-se para acessar os recursos
                personalizados do FitFinder.
            </p>


            <!-- FORMULÁRIO DE CADASTRO -->

            <form>


                <!-- NOME -->

                <div>

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        aria-label="Nome completo"
                        aria-required="true"
                        required>

                </div>


                <!-- E-mail -->

                <div>

                    <label for="email-cadastro">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email-cadastro"
                        name="email-cadastro"
                        placeholder="Digite seu e-mail"
                        aria-label="E-mail para cadastro"
                        aria-required="true"
                        required>

                </div>


                <!-- Senha -->

                <div>

                    <label for="senha-cadastro">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha-cadastro"
                        name="senha-cadastro"
                        placeholder="Crie uma senha"
                        aria-label="Senha para cadastro"
                        aria-required="true"
                        required>

                </div>


                <!-- Objetivo -->

                <div>

                    <label for="objetivo">
                        Qual é seu objetivo?
                    </label>

                    <select
                        id="objetivo"
                        name="objetivo"
                        aria-label="Escolha seu objetivo"
                        aria-required="true"
                        required>

                        <option value="">
                            Selecione seu objetivo
                        </option>

                        <option value="massa">
                            Ganhar massa muscular
                        </option>

                        <option value="emagrecer">
                            Emagrecer
                        </option>

                        <option value="saude">
                            Melhorar a saúde
                        </option>

                        <option value="condicionamento">
                            Melhorar o condicionamento físico
                        </option>

                        <option value="forma">
                            Manter a forma
                        </option>

                    </select>

                </div>


                <!-- Botão de cadastro -->

                <button
                    type="submit"
                    aria-label="Criar uma nova conta">

                    Criar conta

                </button>


            </form>

        </section>


    </main>


    <!-- Rodapè -->

    <footer>

        <p>
            © 2026 FitFinder -
            Encontre. Treine. Evolua.
        </p>

    </footer>


</body>

</html>
