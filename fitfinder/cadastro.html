<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitFinder - Cadastre-se</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Link para facilitar a navegação por teclado -->
    <a href="#conteudo" class="skip-link">Pular para o conteúdo principal</a>


    <header>

        <div>
            <h1>FitFinder</h1>
            <p>Encontre. Treine. Evolua.</p>
        </div>

        <nav aria-label="Navegação principal">
            <ul>
                <li>
                    <a href="index.html">Academias</a>
                </li>
                <li>
                    <a href="login.html">Entrar</a>
                </li>
            </ul>
        </nav>

    </header>


    <main id="conteudo">

        <section class="login-container">

            <h1>Crie sua conta</h1>

            <p class="subtitle">Cadastre-se para acompanhar seus treinos e academias parceiras.</p>


            <form class="form-login">

                <div class="input-group">
                    <label for="nome">Nome Completo *</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmar-senha">Confirmar Senha *</label>
                    <input type="password" id="confirmar-senha" placeholder="Confirme sua senha" required>
                </div>

                <button type="submit">Cadastrar</button>

            </form>


            <div class="register-area">

                <p>Já possui uma conta?</p>

                <a href="login.html">Faça login</a>

            </div>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 FitFinder. Todos os direitos reservados.</p>

    </footer>

    <script src="js/auth.js"></script>

</body>

</html>
