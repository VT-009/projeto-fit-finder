<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>FitFinder - Meus Treinos</title>

</head>

<body>

    <a
        href="#conteudo"
        class="skip-link">
        Pular para o conteúdo principal
    </a>


    <header>

        <div>

            <h1>
                FitFinder
            </h1>

            <p>
                Encontre. Treine. Evolua.
            </p>

        </div>

        <nav aria-label="Navegação principal">

            <ul>

                <li>
                    <a href="index.html">
                        Academias
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main id="conteudo">

        <section class="login-container">

            <h2>
                 Meus Treinos
            </h2>

            <p class="subtitle">
                Cadastre, organize e filtre seus exercícios por grupo muscular.
            </p>


            <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
            <form
                id="form-treino"
                class="form-login">

                <!-- Campo oculto para controlar se estamos editando -->
                <input
                    type="hidden"
                    id="treino-id">

                <div class="input-group">

                    <label for="exercicio">
                        Nome do Exercício *
                    </label>

                    <input
                        type="text"
                        id="exercicio"
                        placeholder="Ex: Agachamento Livre, Rosca Direta..."
                        required>

                </div>

                <div class="input-group">

                    <label for="series">
                        Séries, Repetições e Carga *
                    </label>

                    <input
                        type="text"
                        id="series"
                        placeholder="Ex: 4x12 - 20kg de cada lado"
                        required>

                </div>

               <!-- GRUPOS MUSCULARES (MÚLTIPLA SELEÇÃO) -->
                <div class="input-group">

                    <label>
                        Grupos Musculares Trabalhados (Selecione um ou mais) *
                    </label>

                    <div class="checkbox-container">

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Peito"> Peito
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Costas"> Costas
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Pernas"> Pernas
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Bíceps"> Bíceps
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Tríceps"> Tríceps
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Ombros"> Ombros
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Abdômen"> Abdômen
                        </label>

                        <label class="checkbox-opcao">
                            <input type="checkbox" name="categoria" value="Glúteos"> Glúteos
                        </label>

                    </div>

                </div>

                <button
                    type="submit"
                    id="btn-salvar-treino">
                    Salvar Exercício
                </button>

                <button
                    type="button"
                    id="btn-cancelar-edicao"
                    style="display: none; background-color: #444; border-color: #555;">
                    Cancelar Edição
                </button>

            </form>


            <!-- ÁREA DE FILTRAGEM E EXIBIÇÃO -->
            <div style="margin-top: 40px; padding-top: 25px; border-top: 1px solid var(--borda);">

                <h3>
                    Visualizar Meus Treinos
                </h3>

                <div class="input-group" style="margin-bottom: 20px;">

                    <label for="filtro-categoria">
                        Filtrar por Grupo Muscular:
                    </label>

                    <select id="filtro-categoria">

                        <option value="Todos">
                            Ver Todos os Exercícios
                        </option>

                        <option value="Peito">Peito</option>
                        <option value="Costas">Costas</option>
                        <option value="Pernas">Pernas</option>
                        <option value="Bíceps">Bíceps</option>
                        <option value="Tríceps">Tríceps</option>
                        <option value="Ombros">Ombros</option>
                        <option value="Abdômen">Abdômen</option>
                        <option value="Glúteos">Glúteos</option>

                    </select>

                </div>

                <ul
                    id="lista-treinos"
                    style="list-style: none; padding: 0; margin-top: 15px;">
                    <!-- Preenchido dinamicamente via JavaScript -->
                </ul>

            </div>

            <div class="register-area">

                <a href="index.html">
                    ← Voltar para a página inicial
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 FitFinder - Encontre. Treine. Evolua.
        </p>

    </footer>


    <script src="js/treinos.js"></script>

    <script src="js/user-menu.js"></script>

</body>

</html>
